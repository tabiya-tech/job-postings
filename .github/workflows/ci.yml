name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Pytest
        run: poetry run pytest

      - name: Pylint
        run: poetry run pylint app scripts/mint_api_key.py

      - name: Bandit
        run: poetry run bandit -r app scripts/mint_api_key.py --exclude '*_test.py,app/conftest.py'
